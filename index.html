<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarot Virtual - Pentagrama</title>
  <style>
    body {
      font-family: sans-serif;
      background: #1b1224;
      color: #f2ede6;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-family: 'Courier New', monospace;
      letter-spacing: 2px;
    }

    #tirar {
      font-family: 'Courier New', monospace;
      background: transparent;
      color: #4de8ff;
      border: 1px solid #4de8ff;
      padding: 8px 16px;
      border-radius: 4px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-size: 0.85rem;
    }

    #pentagrama {
      position: relative;
      width: min(90vw, 420px);
      aspect-ratio: 1;
      margin: 40px auto;
    }

    .carta {
      position: absolute;
      width: 17%;
      aspect-ratio: 0.6;
      background: #2b1f3d;
      border: 2px solid #c9a86a;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: 'Courier New', monospace;
      font-size: 0.62rem;
      line-height: 1.2;
      padding: 4px;
      box-sizing: border-box;
      transform: translate(-50%, -50%);
    }

    .contenido-carta {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .contenido-carta.invertida {
      transform: rotate(180deg);
    }

    .icono-carta {
      width: 55%;
      height: auto;
      color: #4de8ff;
      filter: drop-shadow(0 0 3px #4de8ff) drop-shadow(0 0 6px #4de8ff66);
      margin-bottom: 4px;
    }

    .icono-carta svg,
    .icono-carta use {
      stroke: currentColor;
      fill: none;
      stroke-width: 1.3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .punto-1 { top: 12%;   left: 50%; }
    .punto-2 { top: 38.3%; left: 86.1%; }
    .punto-3 { top: 80.7%; left: 72.3%; }
    .punto-4 { top: 80.7%; left: 27.7%; }
    .punto-5 { top: 38.3%; left: 13.9%; }
    .centro  { top: 50%;   left: 50%; }
  </style>
</head>
<body>
  <svg style="display:none">
    <defs>
      <symbol id="icon-loco" viewBox="0 0 24 24">
        <circle cx="10" cy="14" r="6"/>
        <line x1="14" y1="10" x2="20" y2="4"/>
        <polyline points="15,4 20,4 20,9"/>
      </symbol>
      <symbol id="icon-mago" viewBox="0 0 24 24">
        <circle cx="9" cy="8" r="3"/>
        <circle cx="15" cy="8" r="3"/>
        <line x1="12" y1="11" x2="12" y2="20"/>
      </symbol>
      <symbol id="icon-sacerdotisa" viewBox="0 0 24 24">
        <line x1="6" y1="4" x2="6" y2="20"/>
        <line x1="18" y1="4" x2="18" y2="20"/>
        <path d="M14 8a4 4 0 1 1 0 8 5 5 0 0 0 0-8z"/>
      </symbol>
      <symbol id="icon-emperatriz" viewBox="0 0 24 24">
        <circle cx="12" cy="9" r="5"/>
        <line x1="12" y1="14" x2="12" y2="21"/>
        <line x1="8.5" y1="17.5" x2="15.5" y2="17.5"/>
      </symbol>
      <symbol id="icon-emperador" viewBox="0 0 24 24">
        <path d="M12 20V11"/>
        <path d="M12 11c0-4-3-5-5-3"/>
        <path d="M12 11c0-4 3-5 5-3"/>
        <circle cx="7" cy="6" r="1.5"/>
        <circle cx="17" cy="6" r="1.5"/>
      </symbol>
      <symbol id="icon-hierofante" viewBox="0 0 24 24">
        <line x1="6" y1="20" x2="6" y2="10"/>
        <line x1="18" y1="20" x2="18" y2="10"/>
        <path d="M6 10a6 6 0 0 1 12 0"/>
      </symbol>
      <symbol id="icon-enamorados" viewBox="0 0 24 24">
        <circle cx="9" cy="12" r="6"/>
        <circle cx="15" cy="12" r="6"/>
      </symbol>
      <symbol id="icon-carro" viewBox="0 0 24 24">
        <rect x="7" y="7" width="10" height="7" rx="1"/>
        <circle cx="9" cy="18" r="2.5"/>
        <circle cx="15" cy="18" r="2.5"/>
      </symbol>
      <symbol id="icon-justicia" viewBox="0 0 24 24">
        <line x1="12" y1="4" x2="12" y2="18"/>
        <line x1="5" y1="8" x2="19" y2="8"/>
        <path d="M5 8l-3 6h6z"/>
        <path d="M19 8l-3 6h6z"/>
        <line x1="8" y1="20" x2="16" y2="20"/>
      </symbol>
      <symbol id="icon-ermitano" viewBox="0 0 24 24">
        <circle cx="12" cy="10" r="5"/>
        <line x1="12" y1="15" x2="12" y2="21"/>
        <line x1="12" y1="7" x2="12" y2="13"/>
        <line x1="9" y1="10" x2="15" y2="10"/>
      </symbol>
      <symbol id="icon-rueda" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8"/>
        <line x1="12" y1="4" x2="12" y2="20"/>
        <line x1="4" y1="12" x2="20" y2="12"/>
        <line x1="6.3" y1="6.3" x2="17.7" y2="17.7"/>
        <line x1="17.7" y1="6.3" x2="6.3" y2="17.7"/>
      </symbol>
      <symbol id="icon-fuerza" viewBox="0 0 24 24">
        <circle cx="9" cy="6" r="2.2"/>
        <circle cx="15" cy="6" r="2.2"/>
        <ellipse cx="12" cy="15" rx="7" ry="5"/>
      </symbol>
      <symbol id="icon-colgado" viewBox="0 0 24 24">
        <line x1="4" y1="4" x2="20" y2="4"/>
        <line x1="12" y1="4" x2="12" y2="9"/>
        <path d="M6 9h12l-6 9z"/>
        <circle cx="12" cy="20" r="2"/>
      </symbol>
      <symbol id="icon-muerte" viewBox="0 0 24 24">
        <path d="M6 4h12l-6 8z"/>
        <path d="M6 20h12l-6-8z"/>
      </symbol>
      <symbol id="icon-templanza" viewBox="0 0 24 24">
        <path d="M5 8h6v4a3 3 0 0 1-6 0z"/>
        <path d="M13 12h6v4a3 3 0 0 1-6 0z"/>
        <path d="M9 9c2 3 4-3 6 3"/>
      </symbol>
      <symbol id="icon-diablo" viewBox="0 0 24 24">
        <circle cx="8" cy="4" r="1.5"/>
        <circle cx="16" cy="4" r="1.5"/>
        <polygon points="4,6 20,6 12,20"/>
      </symbol>
      <symbol id="icon-torre" viewBox="0 0 24 24">
        <rect x="8" y="6" width="8" height="14"/>
        <polyline points="4,2 10,10 6,10 12,18"/>
      </symbol>
      <symbol id="icon-estrella" viewBox="0 0 24 24">
        <line x1="12" y1="2" x2="12" y2="22"/>
        <line x1="2" y1="12" x2="22" y2="12"/>
        <line x1="5" y1="5" x2="19" y2="19"/>
        <line x1="19" y1="5" x2="5" y2="19"/>
      </symbol>
      <symbol id="icon-luna" viewBox="0 0 24 24">
        <path d="M15 4a9 9 0 1 0 0 16 7 7 0 0 1 0-16z"/>
      </symbol>
      <symbol id="icon-sol" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4"/>
        <line x1="12" y1="2" x2="12" y2="5"/>
        <line x1="12" y1="19" x2="12" y2="22"/>
        <line x1="2" y1="12" x2="5" y2="12"/>
        <line x1="19" y1="12" x2="22" y2="12"/>
        <line x1="4.9" y1="4.9" x2="7" y2="7"/>
        <line x1="17" y1="17" x2="19.1" y2="19.1"/>
        <line x1="19.1" y1="4.9" x2="17" y2="7"/>
        <line x1="7" y1="17" x2="4.9" y2="19.1"/>
      </symbol>
      <symbol id="icon-juicio" viewBox="0 0 24 24">
        <path d="M6 14l6-4v8z"/>
        <line x1="12" y1="10" x2="18" y2="10"/>
        <line x1="12" y1="4" x2="12" y2="7"/>
        <line x1="9" y1="5" x2="10.5" y2="7.5"/>
        <line x1="15" y1="5" x2="13.5" y2="7.5"/>
      </symbol>
      <symbol id="icon-mundo" viewBox="0 0 24 24">
        <ellipse cx="12" cy="12" rx="9" ry="6"/>
        <circle cx="12" cy="12" r="4"/>
      </symbol>
    </defs>
  </svg>

  <h1>Mazo de Arcanos Mayores</h1>
  <button id="tirar">Tirar 6 cartas</button>
  <div id="pentagrama">
    <div class="carta punto-1"></div>
    <div class="carta punto-2"></div>
    <div class="carta punto-3"></div>
    <div class="carta punto-4"></div>
    <div class="carta punto-5"></div>
    <div class="carta centro"></div>
  </div>

  <script>
    const arcanosMayores = [
      { nombre: "El Loco", icono: "loco" },
      { nombre: "El Mago", icono: "mago" },
      { nombre: "La Sacerdotisa", icono: "sacerdotisa" },
      { nombre: "La Emperatriz", icono: "emperatriz" },
      { nombre: "El Emperador", icono: "emperador" },
      { nombre: "El Hierofante", icono: "hierofante" },
      { nombre: "Los Enamorados", icono: "enamorados" },
      { nombre: "El Carro", icono: "carro" },
      { nombre: "La Justicia", icono: "justicia" },
      { nombre: "El Ermitaño", icono: "ermitano" },
      { nombre: "La Rueda de la Fortuna", icono: "rueda" },
      { nombre: "La Fuerza", icono: "fuerza" },
      { nombre: "El Colgado", icono: "colgado" },
      { nombre: "La Muerte", icono: "muerte" },
      { nombre: "La Templanza", icono: "templanza" },
      { nombre: "El Diablo", icono: "diablo" },
      { nombre: "La Torre", icono: "torre" },
      { nombre: "La Estrella", icono: "estrella" },
      { nombre: "La Luna", icono: "luna" },
      { nombre: "El Sol", icono: "sol" },
      { nombre: "El Juicio", icono: "juicio" },
      { nombre: "El Mundo", icono: "mundo" }
    ];

    function mezclar(array) {
      const copia = [...array];
      for (let i = copia.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copia[i], copia[j]] = [copia[j], copia[i]];
      }
      return copia;
    }

    document.getElementById('tirar').addEventListener('click', () => {
      const elegidas = mezclar(arcanosMayores).slice(0, 6).map(carta => ({
        ...carta,
        invertida: Math.random() < 0.5
      }));
      const cajas = document.querySelectorAll('.carta');
      cajas.forEach((caja, index) => {
        const carta = elegidas[index];
        caja.innerHTML = `
          <div class="contenido-carta ${carta.invertida ? 'invertida' : ''}">
            <svg class="icono-carta" viewBox="0 0 24 24"><use href="#icon-${carta.icono}"></use></svg>
            <span>${carta.nombre}</span>
          </div>
        `;
      });
    });
  </script>
</body>
</html>
