<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarot Virtual - Pentagrama</title>
  <style>
    body {
      font-family: sans-serif;
      background: #1b1224;
      color: #f2ede6;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-family: 'Courier New', monospace;
      letter-spacing: 2px;
    }

    #tirar {
      font-family: 'Courier New', monospace;
      background: transparent;
      color: #4de8ff;
      border: 1px solid #4de8ff;
      padding: 8px 16px;
      border-radius: 4px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-size: 0.85rem;
    }

    #pista {
      font-family: 'Courier New', monospace;
      font-size: 0.7rem;
      color: #a99bc2;
      margin-top: 10px;
      visibility: hidden;
    }

    #pista.visible {
      visibility: visible;
    }

    #pentagrama {
      position: relative;
      width: min(90vw, 420px);
      aspect-ratio: 1;
      margin: 40px auto;
    }

    .carta {
      position: absolute;
      width: 17%;
      aspect-ratio: 0.6;
      background: #2b1f3d;
      border: 2px solid #c9a86a;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: 'Courier New', monospace;
      font-size: 0.62rem;
      line-height: 1.2;
      padding: 4px;
      box-sizing: border-box;
      transform: translate(-50%, -50%);
    }

    .carta.con-carta {
      cursor: pointer;
    }

    .carta.con-carta:active {
      border-color: #4de8ff;
    }

    .contenido-carta {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .contenido-carta.invertida {
      transform: rotate(180deg);
    }

    .icono-carta {
      width: 55%;
      height: auto;
      color: #4de8ff;
      filter: drop-shadow(0 0 3px #4de8ff) drop-shadow(0 0 6px #4de8ff66);
      margin-bottom: 4px;
    }

    .icono-carta svg,
    .icono-carta use {
      stroke: currentColor;
      fill: none;
      stroke-width: 1.3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .punto-1 { top: 12%;   left: 50%; }
    .punto-2 { top: 38.3%; left: 86.1%; }
    .punto-3 { top: 80.7%; left: 72.3%; }
    .punto-4 { top: 80.7%; left: 27.7%; }
    .punto-5 { top: 38.3%; left: 13.9%; }
    .centro  { top: 50%;   left: 50%; }

    #modal-fondo {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 5, 18, 0.85);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10;
    }

    #modal-fondo.visible {
      display: flex;
    }

    #modal-panel {
      background: #241a33;
      border: 2px solid #c9a86a;
      border-radius: 12px;
      max-width: 420px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 24px 20px;
      position: relative;
      text-align: left;
    }

    #modal-cerrar {
      position: absolute;
      top: 10px;
      right: 14px;
      background: none;
      border: none;
      color: #f2ede6;
      font-size: 1.4rem;
      line-height: 1;
      cursor: pointer;
    }

    #modal-icono {
      width: 60px;
      height: 60px;
      color: #4de8ff;
      filter: drop-shadow(0 0 4px #4de8ff);
      display: block;
      margin: 0 auto 8px;
    }

    #modal-nombre {
      font-family: 'Courier New', monospace;
      text-align: center;
      letter-spacing: 1px;
      margin: 0 0 4px;
    }

    #modal-orientacion {
      text-align: center;
      font-family: 'Courier New', monospace;
      font-size: 0.75rem;
      color: #4de8ff;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    .significado-seccion {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #4de8ff33;
    }

    .significado-seccion.activa {
      border-color: #4de8ff;
      box-shadow: 0 0 10px #4de8ff44;
      background: #1b1224;
    }

    .significado-seccion h3 {
      margin: 0 0 6px;
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #c9a86a;
    }

    .significado-seccion p {
      margin: 0 0 10px;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .palabras-clave {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .palabra {
      background: #1b1224;
      border: 1px solid #4de8ff;
      color: #4de8ff;
      font-family: 'Courier New', monospace;
      font-size: 0.6rem;
      padding: 3px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
  </style>
</head>

        palabrasDerecho: ["despertar", "renovación", "llamado interior", "evaluación"],
        significadoInvertido: "Autocrítica excesiva, ignorar un llamado importante o dudar demasiado de vos mismo.",
        palabrasInvertido: ["autojuicio", "duda", "negación", "llamado ignorado"]
      },
      {
        nombre: "El Mundo", icono: "mundo",
        significadoDerecho: "Culminación y logro completo: la sensación de plenitud al cerrar un ciclo entero.",
        palabrasDerecho: ["cumplimiento", "integración", "logro", "plenitud"],
        significadoInvertido: "Un ciclo que queda incompleto, falta de cierre o una meta que se sigue postergando.",
        palabrasInvertido: ["incompletitud", "demora", "falta de cierre", "estancamiento"]
      }
    ];

    let cartasEnMesa = [];

    function mezclar(array) {
      const copia = [...array];
      for (let i = copia.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copia[i], copia[j]] = [copia[j], copia[i]];
      }
      return copia;
    }

    const cajas = document.querySelectorAll('.carta');
    const pista = document.getElementById('pista');

    document.getElementById('tirar').addEventListener('click', () => {
      cartasEnMesa = mezclar(arcanosMayores).slice(0, 6).map(carta => ({
        ...carta,
        invertida: Math.random() < 0.5
      }));

      cajas.forEach((caja, index) => {
        const carta = cartasEnMesa[index];
        caja.classList.add('con-carta');
        caja.innerHTML = `
          <div class="contenido-carta ${carta.invertida ? 'invertida' : ''}">
            <svg class="icono-carta" viewBox="0 0 24 24"><use href="#icon-${carta.icono}"></use></svg>
            <span>${carta.nombre}</span>
          </div>
        `;
      });

      pista.classList.add('visible');
    });

    const modalFondo = document.getElementById('modal-fondo');

    function abrirModal(carta) {
      document.getElementById('modal-icono-use').setAttribute('href', `#icon-${carta.icono}`);
      document.getElementById('modal-nombre').textContent = carta.nombre;
      document.getElementById('modal-orientacion').textContent = carta.invertida ? 'Salió invertida' : 'Salió derecha';

      document.getElementById('modal-significado-derecho').textContent = carta.significadoDerecho;
      document.getElementById('modal-palabras-derecho').innerHTML =
        carta.palabrasDerecho.map(p => `<span class="palabra">${p}</span>`).join('');

      document.getElementById('modal-significado-invertido').textContent = carta.significadoInvertido;
      document.getElementById('modal-palabras-invertido').innerHTML =
        carta.palabrasInvertido.map(p => `<span class="palabra">${p}</span>`).join('');

      document.getElementById('seccion-derecho').classList.toggle('activa', !carta.invertida);
      document.getElementById('seccion-invertido').classList.toggle('activa', carta.invertida);

      modalFondo.classList.add('visible');
    }

    document.getElementById('pentagrama').addEventListener('click', (evento) => {
      const caja = evento.target.closest('.carta');
      if (!caja || !caja.classList.contains('con-carta')) return;
      const indice = Array.from(cajas).indexOf(caja);
      abrirModal(cartasEnMesa[indice]);
    });

    document.getElementById('modal-cerrar').addEventListener('click', () => {
      modalFondo.classList.remove('visible');
    });

    modalFondo.addEventListener('click', (evento) => {
      if (evento.target === modalFondo) {
        modalFondo.classList.remove('visible');
      }
    });
  </script>
</body>
</html>
